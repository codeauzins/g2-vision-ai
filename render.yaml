services:
  - type: web
    name: g2-vision-ai
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESULT_TTL_SECONDS
        value: "0"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: IMAGE_MAX_EDGE
        value: "1600"
      - key: IMAGE_JPEG_QUALITY
        value: "80"
      - key: OPENAI_API_KEY
        sync: false
      - key: G2_DEVICE_SECRET
        sync: false
      - key: G2_ADMIN_PASSWORD
        sync: false
      - key: G2_DATA_DIR
        value: /var/data2
      - key: MAX_BURST_UPLOAD_MB
        value: "40"
      - key: PI_DEFAULT_FRAMES
        value: "5"
    disk:
      name: g2-data
      mountPath: /var/data2
      sizeGB: 2
